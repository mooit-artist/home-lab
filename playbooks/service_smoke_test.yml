---
- name: Deploy a non-persistent Compose smoke test to the Docker test host
  hosts: docker-test-01
  become: true
  gather_facts: false
  vars:
    docker_compose_service_project_name: homelab-smoke-test
    docker_compose_service_project_src: /opt/homelab-smoke-test
    docker_compose_service_config:
      services:
        smoke:
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - while :; do sleep 3600; done
          restart: unless-stopped
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          healthcheck:
            test:
              - CMD-SHELL
              - kill -0 1
            interval: 30s
            timeout: 5s
            retries: 3
  roles:
    - docker_compose_service
